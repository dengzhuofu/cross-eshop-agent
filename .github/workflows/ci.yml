name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts evals

      # 封闭测试：conftest 用临时 SQLite + 空 API key，CI 零出网
      - name: Tests
        run: pytest -q

      # 红队回归门禁（v1.4 M7 验收「CI 生效」）：3 条 seed 任一击穿防线即 fail
      - name: Red-team gate
        run: python evals/run_evals.py

      # RAG 检索质量门禁（M9）：黄金查询 Recall/MRR 低于定标线、hybrid 可解释
      # 分数缺失或忠实度护栏失守即 fail（hermetic：hash 嵌入 + 临时库，零出网）
      - name: RAG gate
        run: python evals/rag_evals.py --gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # tsc 类型检查 + vite 构建（零组件库深色面板）
      - name: Build
        run: npm run build
