[project]
name = "cross-eshop-agent"
version = "0.1.0"
description = "跨境电商全链路 Agent 平台 —— M0 walking skeleton（stub 三角 + 状态机持久化 + trace）"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# 官方 LangGraph 结构要求：src 布局映射为可安装本地包，
# 使 langgraph.json 的 dependencies: ["."] 成立。
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# alembic autogenerate 产物不做 lint（与 create_all 的 DDL 必须逐字一致）
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
