services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cesa-postgres
    environment:
      POSTGRES_USER: crosseshop
      POSTGRES_PASSWORD: crosseshop
      POSTGRES_DB: crosseshop
    ports:
      - "5432:5432"
    volumes:
      - cesa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosseshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M4 记忆模块启用 pgvector 后取消注释
  # redis:
  #   image: redis:7-alpine
  #   container_name: cesa-redis
  #   ports:
  #     - "6379:6379"

volumes:
  cesa_pgdata:
